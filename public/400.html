<!doctype html>

<html lang="en">

  <head>

    <title>The server cannot process the request due to a client error (400 Bad Request)</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #f1f5f9;
        color: #1e293b;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        position: relative;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .watermark {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        user-select: none;
        z-index: 0;
        overflow: hidden;
      }
      .watermark span {
        font-size: clamp(10rem, 35vw, 28rem);
        font-weight: 800;
        color: rgba(226, 232, 240, 0.8);
        letter-spacing: 0.1em;
        line-height: 1;
      }
      .card {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 32rem;
        width: 100%;
        margin: 0 auto;
        background-color: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        padding: 2rem;
        border-radius: 1rem;
        border: 1px solid #e2e8f0;
        box-shadow: 0 20px 25px -5px rgba(226, 232, 240, 0.5), 0 8px 10px -6px rgba(226, 232, 240, 0.5);
      }
      @media (min-width: 640px) {
        .card { padding: 3rem; }
      }
      .icon-box {
        width: 4rem;
        height: 4rem;
        background-color: #fef2f2;
        color: #dc2626;
        border-radius: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
        border: 1px solid #fee2e2;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      }
      .icon-box svg { width: 2rem; height: 2rem; }
      .badge {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background-color: #f1f5f9;
        color: #475569;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        margin-bottom: 0.75rem;
        border: 1px solid #e2e8f0;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: #0f172a;
        margin-bottom: 0.75rem;
      }
      @media (min-width: 640px) {
        h1 { font-size: 1.875rem; line-height: 2.25rem; }
      }
      .description {
        color: #475569;
        font-size: 0.875rem;
        line-height: 1.625;
        margin-bottom: 2rem;
      }
      @media (min-width: 640px) {
        .description { font-size: 1rem; }
      }
      .actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        width: 100%;
      }
      @media (min-width: 640px) {
        .actions { flex-direction: row; }
      }
      .btn-back, .btn-home {
        width: 100%;
        padding: 0.625rem 1.25rem;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 0.875rem;
        line-height: 1.25rem;
        transition: all 150ms ease;
        cursor: pointer;
        text-decoration: none;
      }
      @media (min-width: 640px) {
        .btn-back, .btn-home { width: auto; }
      }
      .btn-back {
        border: 1px solid #cbd5e1;
        color: #334155;
        background-color: #ffffff;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      }
      .btn-back:hover { background-color: #f8fafc; border-color: #94a3b8; }
      .btn-home {
        background-color: #2563eb;
        color: #ffffff;
        border: none;
        box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2), 0 4px 6px -4px rgba(37, 99, 235, 0.2);
      }
      .btn-home:hover { background-color: #1d4ed8; }
      footer {
        position: fixed;
        bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.75rem;
        line-height: 1rem;
        font-weight: 500;
        color: #94a3b8;
        z-index: 10;
      }
      footer svg { width: 1rem; height: 1rem; fill: currentColor; }
    </style>
  </head>

  <body>

    <div aria-hidden="true" class="watermark">
      <span>400</span>
    </div>

    <main class="card">

      <div class="icon-box">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
      </div>

      <span class="badge">
        Error 400
      </span>
      <h1>
        Bad Request
      </h1>

      <p class="description">
        <strong>The server cannot process the request due to a client error.</strong> Please check the request and try again. If you're the application owner check the logs for more information.
      </p>

      <div class="actions">
        <button onclick="history.back()" class="btn-back">
          Go Back
        </button>
        <a href="/" class="btn-home">
          Return to Dashboard
        </a>
      </div>

    </main>

    <footer>
      <svg viewBox="0 0 24 24">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
      </svg>
      <span>eLog Dynabook @JuneMinazuki, 2026</span>
    </footer>

  </body>

</html>
